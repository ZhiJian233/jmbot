client:
  # impl: 客户端实现类，不配置默认会使用JmModuleConfig.DEFAULT_CLIENT_IMPL
  # 可配置:
  #  html - 表示网页端
  #  api - 表示APP端
  # APP端不限ip兼容性好，网页端限制ip地区但效率高
  impl: api
  domain:
    api:
      - www.cdnmhwscc.vip
      - www.cdnblackmyth.club
      - www.cdnmhws.cc
      - www.cdnuc.vip
  retry_times: 3

dir_rule:
  # base_dir: 根目录。
  # 此配置也支持引用环境变量，例如
  # base_dir: ${JM_DIR}/下载文件夹/
  base_dir: ./albums/

